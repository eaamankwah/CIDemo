# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://github.com

name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Forces the runner to use Node 24 and eliminates the deprecation warning text
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs flake8, pytest, and a helper to manage empty test exit codes
        pip install flake8 pytest pytest-custom-exit-code
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with pytest
      run: |
        # PYTHONPATH=. ensures local modules are discoverable
        # --suppress-no-test-exit-code prevents failure if you haven't added tests yet
        PYTHONPATH=. pytest --suppress-no-test-exit-code
